<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--tx:#1f1f1f;--mut:#666;--bd:#d9d5cc;--ac:#b5221f;--inp:#faf9f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181a;--panel:#232326;--tx:#ececec;--mut:#9a9a9f;--bd:#3a3a40;--inp:#1c1c1f}}
:root[data-theme="dark"]{--bg:#18181a;--panel:#232326;--tx:#ececec;--mut:#9a9a9f;--bd:#3a3a40;--inp:#1c1c1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;max-width:1700px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px}
h1{font-size:17px;margin:2px 0 10px}details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600;padding:4px 0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=date],textarea,select{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--inp);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:58px}input[type=color]{width:100%;height:32px;border:1px solid var(--bd);border-radius:7px;background:var(--inp);padding:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:7px;padding:7px 10px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:hover{filter:brightness(.96)}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--tx);margin:8px 0}.sig{border:1px dashed var(--bd);border-radius:9px;padding:8px;margin-top:8px}
.up{display:flex;gap:6px;align-items:center;margin-top:5px}.up input{font-size:12px;max-width:100%}.small{font-size:12px;color:var(--mut)}
.stage{position:sticky;top:16px;align-self:start}.sheet{background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.18);border-radius:3px;line-height:0}
.sheet svg{width:100%;height:auto;display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
#toast{font-size:12px;color:var(--mut)}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none;order:2}.stage{position:static;order:1}}
</style></head><body>
<div class="app">
<aside class="panel" id="panel"></aside>
<main class="stage">
<div class="bar"><button class="pri" id="bPng">Download PNG</button><button id="bPdf">Download PDF</button><button id="bSvg">Download SVG</button><button id="bRst">Reset</button><span id="toast"></span></div>
<div class="sheet" id="sheet"></div>
<p class="small">Live preview · A4 landscape. Everything on the left updates the certificate instantly.</p>
</main></div>
<script>
const W=1123,H=794;
const TYPES={
contribution:{label:'Appreciation – project contribution',title:'CERTIFICATE OF APPRECIATION',sub:'For Outstanding Contribution to the Project',presented:'This certificate is proudly presented to',body:'in recognition of your valuable contributions, dedication and hard work on {project}. Your efforts have made a lasting impact on the success of {org}.'},
appreciation:{label:'Appreciation – general',title:'CERTIFICATE OF APPRECIATION',sub:'',presented:'This certificate is proudly presented to',body:'in sincere appreciation of your outstanding dedication, commitment and valuable support to {org}.'},
participation:{label:'Participation',title:'CERTIFICATE OF PARTICIPATION',sub:'',presented:'This is to certify that',body:'has actively participated in {project} organized by {org}. We appreciate your enthusiasm and valuable involvement.'},
achievement:{label:'Achievement / Excellence',title:'CERTIFICATE OF ACHIEVEMENT',sub:'For Excellence and Outstanding Performance',presented:'This certificate is awarded to',body:'in recognition of exceptional achievement and commitment demonstrated during {project}.'}};
const SADAT={name:'Sadat Mahmud',title:'President',img:''};
const FONTS={classic:"Georgia,'Times New Roman',serif",elegant:"'Palatino Linotype',Palatino,'Book Antiqua',serif",modern:"'Helvetica Neue',Arial,sans-serif"};
const NFONTS={italic:"Georgia,'Times New Roman',serif|italic",script:"'Brush Script MT','Segoe Script','Lucida Handwriting',cursive|normal",sans:"'Helvetica Neue',Arial,sans-serif|italic"};
const today=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
const defaults=()=>({type:'contribution',...Object.fromEntries(['title','sub','presented','body'].map(k=>[k,TYPES.contribution[k]])),
name:'Recipient Name',project:'the Firmware Development Project',org:'Embedded System Research Center',date:today(),certId:'CERT-'+new Date().getFullYear()+'-0001',
showQR:true,qrText:'',sigCount:1,sigs:[{...SADAT},{name:'Name Surname',title:'Position',img:''},{name:'Name Surname',title:'Position',img:''}],
logos:{l:'',c:'',r:''},emblem:true,seal:true,frame:'#3a3a3a',accent:'#b5221f',ink:'#222222',paper:'#fdfcf8',border:'guilloche',font:'classic',nfont:'italic',nsize:60});
let S=defaults();
try{const x=JSON.parse(localStorage.getItem('certstudio')||'null');if(x&&x.sigs)S={...S,...x}}catch(e){}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wrap(t,n){const o=[];for(const para of String(t).split('\n')){let l='';for(const w of para.split(/\s+/).filter(Boolean)){if((l+' '+w).trim().length>n&&l){o.push(l);l=w}else l=(l+' '+w).trim()}o.push(l)}return o}
function band(len,y0,h){const n=Math.max(1,Math.round(len/(h*1.9))),lam=len/n;let o='';for(const[ph,w]of[[0,.7],[Math.PI,.7],[Math.PI/2,.45],[1.5*Math.PI,.45]]){let d='';for(let i=0;i<=len;i+=2)d+=(i?'L':'M')+i+','+(y0+h/2+(h/2-1)*Math.sin(2*Math.PI*i/lam+ph)).toFixed(1);o+=`<path d="${d}" stroke-width="${w}"/>`}return o}
function rosette(x,y){let s=`<g transform="translate(${x},${y}) scale(.6)">`;for(let k=0;k<12;k++)s+=`<ellipse cy="-15" rx="5" ry="12" transform="rotate(${k*30})" stroke-width="1"/>`;return s+'<circle r="7" stroke-width="1.4"/><circle r="3" fill="currentColor"/><circle r="30" stroke-width="1"/></g>'}
function frame(){const f=S.frame;let o=`<g fill="none" stroke="${f}" color="${f}">`;
 if(S.border==='guilloche'){o+=`<rect x="22" y="22" width="${W-44}" height="${H-44}" stroke-width="1.6"/><rect x="28" y="28" width="${W-56}" height="${H-56}" stroke-width=".6"/><rect x="68" y="68" width="${W-136}" height="${H-136}" stroke-width=".6"/><rect x="73" y="73" width="${W-146}" height="${H-146}" stroke-width="1.4"/>`;
  o+=`<g transform="translate(68,0)">${band(W-136,34,28)}</g><g transform="translate(68,${H}) scale(1,-1)">${band(W-136,34,28)}</g><g transform="translate(${W},68) rotate(90)">${band(H-136,34,28)}</g><g transform="translate(0,${H-68}) rotate(-90)">${band(H-136,34,28)}</g>`;
  for(const[x,y]of[[48,48],[W-48,48],[48,H-48],[W-48,H-48]])o+=rosette(x,y)}
 else if(S.border==='simple')o+=`<rect x="24" y="24" width="${W-48}" height="${H-48}" stroke-width="3"/><rect x="34" y="34" width="${W-68}" height="${H-68}" stroke-width=".8"/><rect x="44" y="44" width="${W-88}" height="${H-88}" stroke-width="1.4"/>`;
 else o+=`<rect x="30" y="30" width="${W-60}" height="${H-60}" stroke-width="1"/>`;
 return o+'</g>'}
function seal(x,y){const a=S.accent;let p='';for(let k=0;k<48;k++){const r=k%2?39:44,t=Math.PI*2*k/48;p+=`${(r*Math.cos(t)).toFixed(1)},${(r*Math.sin(t)).toFixed(1)} `}
 let st='';for(let k=0;k<10;k++){const r=k%2?7:16,t=-Math.PI/2+Math.PI*k/5;st+=`${(r*Math.cos(t)).toFixed(1)},${(r*Math.sin(t)).toFixed(1)} `}
 return `<g transform="translate(${x},${y}) scale(.9)"><path d="M-14,20 L-30,78 L-14,68 L-6,82 L6,24Z" fill="${a}" opacity=".78"/><path d="M14,20 L30,78 L14,68 L6,82 L-6,24Z" fill="${a}"/><polygon points="${p}" fill="${a}"/><circle r="34" fill="none" stroke="#fff" stroke-opacity=".6"/><circle r="28" fill="#000" fill-opacity=".18" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/><polygon points="${st}" fill="#fff" fill-opacity=".92"/></g>`}
function img(src,x,y,w,h,al){return src?`<image x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="${al} meet" href="${src}" xlink:href="${src}"/>`:''}
function qrSvg(x,y,sz){if(!S.showQR||typeof qrcode==='undefined')return'';
 const txt=S.qrText.trim()||`${S.org} | ID: ${S.certId} | ${S.name} | ${S.date}`;let q;try{q=qrcode(0,'M');q.addData(txt);q.make()}catch(e){return''}
 const n=q.getModuleCount(),c=sz/n;let d='';for(let r=0;r<n;r++){let k=0;while(k<n){if(q.isDark(r,k)){const s=k;while(k<n&&q.isDark(r,k))k++;d+=`M${(s*c).toFixed(2)},${(r*c).toFixed(2)}h${((k-s)*c).toFixed(2)}v${c.toFixed(2)}h-${((k-s)*c).toFixed(2)}z`}else k++}}
 return `<g><rect x="${x-6}" y="${y-6}" width="${sz+12}" height="${sz+12}" rx="3" fill="#fff" stroke="${S.frame}" stroke-opacity=".4" stroke-width=".6"/><g transform="translate(${x},${y})"><path d="${d}" fill="#111"/></g></g><text x="${x+sz/2}" y="${y+sz+24}" text-anchor="middle" font-family="${FONTS[S.font]}" font-size="9" font-weight="bold" letter-spacing="1.5" fill="${S.ink}" fill-opacity=".7">SCAN TO VERIFY</text>`}
function T(t,x,y,sz,o={}){return t===''?'':`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="${o.f||FONTS[S.font]}" font-size="${sz}" font-weight="${o.w||'normal'}" font-style="${o.s||'normal'}" letter-spacing="${o.ls||0}" fill="${o.c||S.ink}"${o.op?` fill-opacity="${o.op}"`:''}>${esc(t)}</text>`}
function build(){const f=S.font,ink=S.ink,cx=W/2,tok=t=>t.replace(/\{project\}/g,S.project).replace(/\{org\}/g,S.org).replace(/\{name\}/g,S.name);
 let o=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><title>${esc(S.title)} – ${esc(S.name)}</title><rect width="${W}" height="${H}" fill="${S.paper}"/>`+frame();
 o+=img(S.logos.l,96,84,250,104,'xMinYMid')+img(S.logos.r,W-346,84,250,104,'xMaxYMid');
 if(S.logos.c)o+=img(S.logos.c,cx-135,80,270,116,'xMidYMid');
 else if(S.emblem){let st='';for(let k=0;k<10;k++){const r=k%2?7:17,t=-Math.PI/2+Math.PI*k/5;st+=`${(cx+r*Math.cos(t)).toFixed(1)},${(134+r*Math.sin(t)).toFixed(1)} `}
  o+=`<circle cx="${cx}" cy="134" r="38" fill="none" stroke="${S.accent}" stroke-width="2"/><circle cx="${cx}" cy="134" r="33" fill="none" stroke="${S.accent}" stroke-width=".8"/><polygon points="${st}" fill="${S.accent}"/>`}
 o+=T(S.title,cx,240,40,{w:'bold',ls:3});o+=`<line x1="${cx-190}" y1="256" x2="${cx+190}" y2="256" stroke="${ink}" stroke-opacity=".55" stroke-width=".9"/>`;
 let y=286;if(S.sub){o+=T(S.sub,cx,y,19,{w:'bold',c:S.accent,ls:1});y+=34}else y+=6;
 o+=T(S.presented,cx,y+8,16,{s:'italic',ls:1,op:.75});
 const[nf,ns]=NFONTS[S.nfont].split('|');y+=S.nsize*.9+14;o+=T(S.name,cx,y,+S.nsize,{f:nf,s:ns,c:ink});
 o+=`<line x1="${cx-300}" y1="${y+16}" x2="${cx+300}" y2="${y+16}" stroke="${ink}" stroke-opacity=".55" stroke-width=".9"/>`;
 const L=wrap(tok(S.body),92);let by=y+52;L.slice(0,5).forEach((l,i)=>o+=T(l,cx,by+i*26,17));
 if(S.seal)o+=seal(170,548);
 o+=qrSvg(W-205,512,70);
 o+=T('ISSUE DATE',cx-120,556,9,{w:'bold',ls:1.8,op:.65})+T(S.date,cx-120,577,15,{w:'bold'})+T('CERTIFICATE ID',cx+120,556,9,{w:'bold',ls:1.8,op:.65})+T(S.certId,cx+120,577,15,{w:'bold'});
 const n=+S.sigCount,xs=n==1?[cx]:n==2?[cx-190,cx+190]:[cx-300,cx,cx+300];
 for(let i=0;i<n;i++){const g=S.sigs[i],x=xs[i];o+=img(g.img,x-100,604,200,48,'xMidYMax')+`<line x1="${x-115}" y1="656" x2="${x+115}" y2="656" stroke="${ink}" stroke-width="1"/>`+T(g.name,x,677,14.5,{w:'bold'});wrap(g.title,40).slice(0,2).forEach((l,j)=>o+=T(l,x,692+j*13,10.5,{op:.8}))}
 return o+'</svg>'}
function render(){$('#sheet').innerHTML=build();try{localStorage.setItem('certstudio',JSON.stringify(S))}catch(e){}}
const fld=(k,l,t='text')=>`<label>${l}</label><input type="${t}" data-k="${k}">`,ta=(k,l)=>`<label>${l}</label><textarea data-k="${k}"></textarea>`,chk=(k,l)=>`<label class="chk"><input type="checkbox" data-k="${k}">${l}</label>`,
sel=(k,l,o)=>`<label>${l}</label><select data-k="${k}">${o.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`,
up=(k,l)=>`<label>${l}</label><div class="up"><input type="file" accept="image/*" data-up="${k}"><button data-clr="${k}" type="button">Clear</button></div>`;
$('#panel').innerHTML=`<h1>Certificate Studio</h1>
<details open><summary>Template</summary>${sel('type','Certificate type',Object.entries(TYPES).map(([k,v])=>[k,v.label]))}<p class="small">Choosing a type fills the title and wording; you can edit everything afterwards.</p></details>
<details open><summary>Content</summary>${fld('title','Title')}${fld('sub','Sub-title (optional)')}${fld('presented','Presented-to line')}${fld('name','Recipient name')}${fld('project','Project / event')}${fld('org','Organization')}${ta('body','Body text – use {name}, {project}, {org}')}</details>
<details open><summary>Details</summary><div class="row">${fld('date','Issue date')}${fld('certId','Certificate ID')}</div>${chk('showQR','Show QR code')}${fld('qrText','QR content (e.g. a verification link; blank = auto)')}${chk('seal','Show seal')}</details>
<details open><summary>Signatures</summary>${sel('sigCount','Number of signatures',[[1,'1 – centred at bottom'],[2,'2'],[3,'3']])}<button type="button" id="pSadat" style="margin-top:8px">Use Sadat Mahmud · President (single signature)</button>
${[0,1,2].map(i=>`<div class="sig" data-sg="${i}"><b class="small">Signature ${i+1}</b>${fld(`sigs.${i}.name`,'Name')}${ta(`sigs.${i}.title`,'Title / organization (new line = new row)')}${up(`sigs.${i}.img`,'Signature image (optional)')}</div>`).join('')}</details>
<details><summary>Logos</summary>${up('logos.l','Left logo')}${up('logos.c','Centre logo')}${up('logos.r','Right logo')}${chk('emblem','Default emblem when no centre logo')}</details>
<details><summary>Style</summary><div class="row3"><div><label>Border</label><input type="color" data-k="frame"></div><div><label>Accent</label><input type="color" data-k="accent"></div><div><label>Text</label><input type="color" data-k="ink"></div></div><label>Paper</label><input type="color" data-k="paper">
${sel('border','Border style',[['guilloche','Ornamental'],['simple','Simple triple'],['none','Minimal']])}${sel('font','Text font',[['classic','Classic serif'],['elegant','Elegant serif'],['modern','Modern sans']])}${sel('nfont','Name font',[['italic','Serif italic'],['script','Script'],['sans','Sans italic']])}<label>Name size</label><input type="range" min="36" max="84" data-k="nsize" style="width:100%"></details>`;
const get=(p)=>p.split('.').reduce((a,k)=>a?.[k],S),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
function sync(){document.querySelectorAll('[data-k]').forEach(e=>{const v=get(e.dataset.k);if(e.type==='checkbox')e.checked=!!v;else e.value=v??''});document.querySelectorAll('[data-sg]').forEach(e=>e.style.display=+e.dataset.sg<+S.sigCount?'':'none')}
$('#panel').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=t.type==='checkbox'?t.checked:t.value;if(k==='sigCount')v=+v;set(k,v);
 if(k==='type'){const p=TYPES[v];['title','sub','presented','body'].forEach(x=>S[x]=p[x]);sync()}if(k==='sigCount')sync();render()});
$('#panel').addEventListener('change',e=>{const k=e.target.dataset.up;if(!k||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{set(k,r.result);render()};r.readAsDataURL(e.target.files[0])});
$('#panel').addEventListener('click',e=>{const k=e.target.dataset.clr;if(k){set(k,'');render();document.querySelectorAll('[data-up]').forEach(i=>{if(i.dataset.up===k)i.value=''})}
 if(e.target.id==='pSadat'){S.sigCount=1;S.sigs[0]={...SADAT};sync();render()}});
$('#bRst').onclick=()=>{S=defaults();sync();render()};
const toast=m=>{$('#toast').textContent=m;setTimeout(()=>$('#toast').textContent='',3500)};
async function save(name,data){let d=null;try{d=await window.claude?.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data});toast('Saved '+name)}catch(e){toast(e.code==='declined'?'Download cancelled':'Download unavailable here')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click()}
const fname=ext=>`Certificate_${S.name.replace(/[^\w]+/g,'_')}.${ext}`;
function toCanvas(){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);res(c)};i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(build())})}
$('#bSvg').onclick=()=>save(fname('svg'),new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+build()],{type:'image/svg+xml'}));
$('#bPng').onclick=async()=>{try{const c=await toCanvas();c.toBlob(b=>save(fname('png'),b),'image/png')}catch(e){toast('PNG export failed')}};
$('#bPdf').onclick=async()=>{try{const c=await toCanvas(),{jsPDF}=window.jspdf,p=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,841.89,595.28);save(fname('pdf'),p.output('blob'))}catch(e){toast('PDF export failed')}};
sync();render();
</script></body></html>
