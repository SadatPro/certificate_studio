<style>
:root{--bg:#f4f2ee;--panel:#fff;--tx:#1f1f1f;--mut:#666;--bd:#d9d5cc;--ac:#b5221f;--inp:#faf9f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181a;--panel:#232326;--tx:#ececec;--mut:#9a9a9f;--bd:#3a3a40;--inp:#1c1c1f}}
:root[data-theme="dark"]{--bg:#18181a;--panel:#232326;--tx:#ececec;--mut:#9a9a9f;--bd:#3a3a40;--inp:#1c1c1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;max-width:1700px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px}
h1{font-size:17px;margin:2px 0 10px}details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600;padding:4px 0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=date],textarea,select{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--inp);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:58px}input[type=color]{width:100%;height:32px;border:1px solid var(--bd);border-radius:7px;background:var(--inp);padding:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:7px;padding:7px 10px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:hover{filter:brightness(.96)}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--tx);margin:8px 0}.sig{border:1px dashed var(--bd);border-radius:9px;padding:8px;margin-top:8px}
.up{display:flex;gap:6px;align-items:center;margin-top:5px}.up input{font-size:12px;max-width:100%}.small{font-size:12px;color:var(--mut)}
.stage{position:sticky;top:16px;align-self:start}.sheet{background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.18);border-radius:3px;line-height:0}
.sheet svg{width:100%;height:auto;display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
#toast{font-size:12px;color:var(--mut)}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none;order:2}.stage{position:static;order:1}}
</style></head><body>
